# Vendored from https://github.com/emotechlab/silero-rs @ 26a6460 (MIT).
# Only change: upstream hard-pins `ort = "=2.0.0-rc.10"` / ndarray 0.16, which blocks linking
# speakrs (needs ort >= rc.12, ndarray 0.17). Drop this copy once upstream relaxes the pin.
[package]
name = "silero"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[features]
default = ["static-model", "audio_resampler"]
static-model = []
audio_resampler = ["dep:rubato"]
serde = ["dep:serde"]

[dependencies]
anyhow = "1.0.86"
ndarray = "0.17"
ort = "2.0.0-rc.12"
rubato = { version = "0.16.0", optional = true }
serde = { version = "1.0.208", features = ["derive"], optional = true }
thiserror = "2.0.4"
tracing = { version = "0.1.40", default-features = false, features = ["std"] }

[dev-dependencies]
hound = "=3.5.1"
tracing-test = "=0.2.6"
